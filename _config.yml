title: "Miette's blog"
subtitle: "One thought per sometimes"
description: "Rendering Engineer trying to reduce the bloat in fast and pretty pixels"
name: "Tristan Delort"
url: "https://tdelort.github.io/"
repository: "tdelort/tdelort.github.io"

remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "dirt" # "default", "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

locale: "en-GB"
show_date: true

defaults:
  # _posts
  - scope:
      path: "_posts"
      type: posts
    values:
      author_profile: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      author_profile: true
      layout: single
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true

comments:
  provider: "utterances"
  utterances:
    theme: "github-light"
    issue_term: "pathname"
    label: "comment"

collections:
  portfolio:
    output: true
    permalink: /:collection/:path/

author:
  name     : "Tristan Delort"
  avatar   : "/assets/images/profile_placeholder_0.jpg" # TODO : add image
  bio      : "Rendering Engineer. Worked at Spiders on GreedFall : The Dying World"
  location : "IDF, France"
  # fediverse: "@you@instance.social"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/tdelort"

include:
  - _pages
exclude:
  - CHANGELOG
  - Gemfile
  - LICENSE
  - README