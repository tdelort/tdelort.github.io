<figure>
    <a href="{{site.baseurl}}{{ include.path }}">
    <img
        src="{{site.baseurl}}{{ include.path }}"
        alt="{{ include.alt }}" 
        {% if include.height %}
        style="height: {{ include.height }};"
        {% endif %}
        />
    </a>
    {% if include.caption %}
    <figcaption>{{ include.caption }}</figcaption>
    {% endif %}
</figure>
